# 자격증 서비스 전용 DB (AURA와 따로)
name: aura-cert
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cert
      POSTGRES_PASSWORD: cert
      POSTGRES_DB: aura_cert
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cert_pg:/var/lib/postgresql/data

volumes:
  cert_pg:
